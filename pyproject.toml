[project]
name = "decision-models"
version = "0.2.0"
description = "Decision models that pick one option per forward pass: LLM-as-Jev decoders and masked-LM encoders, with an evidence head"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate==1.15.0",
    "datasets",
    "jinja2",
    "loguru>=0.7.3",
    "nltk>=3.10.3",
    "numpy",
    "omegaconf>=2.4",  # Literal-typed config fields
    "pandas",
    "peft==0.21.0",
    "scikit-learn>=1.9.1",
    "scipy",
    "tensorboard",
    "tensordict>=0.14.3",
    "torch==2.9.0",
    "transformers==5.20.2",  # >= 5.20: native UltraBERT
]

[project.optional-dependencies]
# Qwen3.5 decoders: fast Gated DeltaNet and short convolutions. causal-conv1d
# is built from source against the installed torch (set CUDA_HOME).
qwen35 = ["flash-linear-attention==0.5.2", "causal-conv1d==1.5.3.post1"]
spans = ["openai>=1.50"]  # decision_models.evidence.spans (vLLM server, OpenAI API)
serve = ["fastapi>=0.115", "uvicorn>=0.30"]  # decision_models.inference.server
profile = ["matplotlib"]  # decision_models.profiling (memory timeline HTML)
blog = ["fastapi>=0.115", "uvicorn>=0.30"]  # blogs/ export scripts
dev = ["pytest", "ruff"]

[project.scripts]
decision-models-build-data = "decision_models.data.build:main"
decision-models-train-decoder = "decision_models.training.decoder:main"
decision-models-train-encoder = "decision_models.training.encoder:main"
decision-models-evaluate = "decision_models.evaluation.evaluate:main"
decision-models-benchmarks = "decision_models.evaluation.benchmarks:main"
decision-models-train-evidence = "decision_models.evidence.train:main"
decision-models-spans = "decision_models.evidence.spans:main"
decision-models-predict = "decision_models.inference.predict:main"
decision-models-merge = "decision_models.inference.merge:main"
decision-models-sglang = "decision_models.inference.sglang:main"
decision-models-serve = "decision_models.inference.server:main"
decision-models-cite-eval = "decision_models.citation.evaluate:main"

# CUDA 12.8 wheels.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
no-build-isolation-package = ["causal-conv1d"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["decision_models*"]

[tool.setuptools.package-data]
decision_models = ["prompts/*.j2", "inference/page.html"]

[tool.ruff]
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I", "D", "N", "UP", "B"]
ignore = ["D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "E501"]  # Inline fixture data.
"src/decision_models/data/sources/download.py" = ["E501"]  # pinned URLs and hashes

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
