name: Deploy docs and blog

# One GitHub Pages site: the docs (MkDocs, docs/) at the root and the blog
# (Vite, blogs/) under /blog/.
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "blogs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build docs
        run: |
          pip install mkdocs-material==9.5.49
          mkdocs build --strict --site-dir site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: blogs/package-lock.json

      - name: Install blog
        working-directory: blogs
        run: npm ci

      - name: Build blog
        working-directory: blogs
        env:
          BASE_PATH: /${{ github.event.repository.name }}/blog/
        run: npm run build

      - name: Add blog to site
        run: cp -r blogs/dist site/blog

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
